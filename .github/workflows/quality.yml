name: Quality

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Docs index up-to-date
        run: |
          npm run docs:index
          git diff --exit-code docs/requirements/INDEX.md || {
            echo "::error::docs/requirements/INDEX.md 未更新，请本地运行 npm run docs:index 后提交";
            exit 1;
          }
