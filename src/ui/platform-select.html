<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>选择平台 - Estrix Code</title>
  <style>
    :root {
      --bg: #fafaf9;
      --surface: #ffffff;
      --surface-hover: #f5f5f4;
      --border: rgba(28, 25, 23, 0.08);
      --border-strong: rgba(28, 25, 23, 0.14);
      --text: #1c1917;
      --text-2: #57534e;
      --text-dim: #a8a29e;
      --accent: #4d6bfe;
      --accent-soft: rgba(77, 107, 254, 0.08);
      --danger: #b91c1c;
      --radius: 8px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: "SFMono-Regular", "Consolas", "Liberation Mono", monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1917;
        --surface: #292524;
        --surface-hover: #322e2b;
        --border: rgba(255, 255, 255, 0.07);
        --border-strong: rgba(255, 255, 255, 0.14);
        --text: #e7e5e4;
        --text-2: #a8a29e;
        --text-dim: #5d6280;
        --accent: #6b83ff;
        --accent-soft: rgba(107, 131, 255, 0.12);
        --danger: #ef4444;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      padding: 32px;
    }
    .wrap { width: 100%; max-width: 720px; }
    .head { margin-bottom: 24px; }
    .head h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
    .head p { font-size: 13px; color: var(--text-2); margin-top: 4px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px;
    }
    .card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .card:hover { border-color: var(--border-strong); background: var(--surface-hover); }
    .card:active { transform: translateY(1px); }
    .logo {
      width: 36px; height: 36px; flex-shrink: 0;
      border-radius: 6px;
      background: var(--surface-hover);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .logo img { width: 24px; height: 24px; object-fit: contain; }
    .logo .fb { font-size: 15px; font-weight: 700; color: var(--accent); }
    .meta { min-width: 0; }
    .name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .desc { font-size: 12px; color: var(--text-dim); }
    .card.import { border-style: dashed; justify-content: center; }
    .card.import .name { color: var(--text-2); font-weight: 400; }
    .acts { position: absolute; top: 6px; right: 6px; display: none; gap: 4px; }
    .card:hover .acts { display: flex; }
    .acts button {
      width: 20px; height: 20px; line-height: 1;
      border: none; border-radius: 4px; cursor: pointer;
      font-size: 12px; background: var(--surface-hover); color: var(--text-2);
    }
    .acts button:hover { background: var(--border-strong); color: var(--text); }
    .acts button.del:hover { background: var(--danger); color: #fff; }
    .empty, .loading { font-size: 13px; color: var(--text-dim); padding: 8px 0; }
    .error { font-size: 13px; color: var(--danger); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <h1>Estrix Code</h1>
      <p>选择要使用的 AI 平台</p>
    </div>
    <div id="platform-list" class="grid">
      <div class="loading">加载中...</div>
    </div>
  </div>
  <script>
    async function loadPlatforms() {
      try {
        const res = await window.electronAPI.listProviders();
        const providers = (res && res.success && res.providers) || [];
        const listEl = document.getElementById('platform-list');
        if (!providers.length) {
          listEl.className = '';
          listEl.innerHTML = '<div class="empty">暂无可用平台</div>';
          return;
        }
        listEl.className = 'grid';
        listEl.innerHTML = providers.map(function (p) {
          const actions = p.custom
            ? '<div class="acts">' +
                '<button class="rep" data-id="' + p.id + '" title="替换">↻</button>' +
                '<button class="del" data-id="' + p.id + '" data-path="' + (p.path || '') + '" title="删除">×</button>' +
              '</div>'
            : '';
          return '<div class="card" data-id="' + p.id + '">' +
            actions +
            '<div class="logo" data-name="' + p.name + '">' +
              '<img src="logos/' + encodeURIComponent(p.id) + '.svg" data-ext="svg" alt="" />' +
            '</div>' +
            '<div class="meta"><div class="name">' + p.name + '</div><div class="desc">内置平台</div></div>' +
          '</div>';
        }).join('') +
        '<div class="card import" id="platform-import-card">' +
          '<div class="meta"><div class="name">导入自定义平台</div></div>' +
        '</div>';

        listEl.querySelectorAll('.logo img').forEach(function (img) {
          img.addEventListener('error', function () {
            const c = img.parentElement;
            const name = c.getAttribute('data-name') || '?';
            if (img.dataset.ext === 'svg') {
              img.dataset.ext = 'png';
              img.src = img.src.replace(/\.svg$/i, '.png');
              return;
            }
            if (img.dataset.ext === 'png') {
              img.dataset.ext = 'ico';
              img.src = img.src.replace(/\.png$/i, '.ico');
              return;
            }
            c.innerHTML = '<span class="fb">' + name.charAt(0).toUpperCase() + '</span>';
          });
        });
        listEl.querySelectorAll('.card[data-id]').forEach(function (card) {
          card.addEventListener('click', async function () {
            try { await window.electronAPI.selectPlatform(card.dataset.id); }
            catch (err) { alert('进入平台失败: ' + (err && err.message ? err.message : err)); }
          });
        });
        listEl.querySelectorAll('.del').forEach(function (btn) {
          btn.addEventListener('click', async function (e) {
            e.stopPropagation();
            const filePath = btn.dataset.path, providerId = btn.dataset.id;
            if (!filePath) return;
            if (!confirm('确定删除这个自定义平台吗？')) return;
            try {
              const r = await window.electronAPI.removeProvider(filePath, providerId);
              if (r && r.success) await loadPlatforms();
              else alert('删除失败: ' + ((r && r.error) || '未知错误'));
            } catch (err) { alert('删除失败: ' + (err.message || err)); }
          });
        });
        listEl.querySelectorAll('.rep').forEach(function (btn) {
          btn.addEventListener('click', async function (e) {
            e.stopPropagation();
            try {
              const r = await window.electronAPI.replaceProvider(btn.dataset.id);
              if (r && r.success) await loadPlatforms();
              else if (!(r && r.canceled)) alert('替换失败: ' + ((r && r.error) || '未知错误'));
            } catch (err) { alert('替换失败: ' + (err.message || err)); }
          });
        });
        const importCard = document.getElementById('platform-import-card');
        if (importCard) {
          importCard.addEventListener('click', async function () {
            try {
              const r = await window.electronAPI.importProvider();
              if (r && r.success) await loadPlatforms();
              else if (!(r && r.canceled)) alert('导入失败: ' + ((r && r.error) || '未知错误'));
            } catch (err) { alert('导入失败: ' + (err.message || err)); }
          });
        }
      } catch (err) {
        document.getElementById('platform-list').innerHTML =
          '<div class="error">加载失败: ' + (err && err.message ? err.message : err) + '</div>';
      }
    }
    if (window.electronAPI && window.electronAPI.listProviders) loadPlatforms();
    else setTimeout(function () {
      if (window.electronAPI && window.electronAPI.listProviders) loadPlatforms();
      else document.getElementById('platform-list').innerHTML = '<div class="error">API 未就绪，请重启应用</div>';
    }, 500);
  </script>
</body>
</html>
