<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estrix Code</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bar-bg: #14162a;
      --tab-bg: #1c1f38;
      --tab-active-bg: #262a4a;
      --tab-text: #a8add8;
      --tab-text-active: #e6e9ff;
      --border: rgba(255, 255, 255, 0.08);
      --primary: #8b93ff;
      --danger: #ff6b7a;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #0d0f1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      user-select: none;
    }

    /* 标签栏（高度与主进程 TAB_BAR_HEIGHT 保持一致） */
    #tabbar {
      height: 40px;
      background: var(--bar-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: stretch;
      padding: 0 6px;
      gap: 4px;
      overflow-x: auto;
      overflow-y: hidden;
    }

    #tabbar::-webkit-scrollbar { height: 0; }

    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 12px;
      margin-top: 6px;
      min-width: 120px;
      max-width: 220px;
      height: 34px;
      background: var(--tab-bg);
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      color: var(--tab-text);
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease, color 0.15s ease;
      position: relative;
    }

    .tab:hover { background: var(--tab-active-bg); color: var(--tab-text-active); }

    .tab.active {
      background: var(--tab-active-bg);
      color: var(--tab-text-active);
      border-color: rgba(139, 147, 255, 0.4);
    }

    .tab.dragging { opacity: 0.4; }
    .tab.drag-over { border-left: 2px solid var(--primary); }

    .tab-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tab-close {
      width: 16px;
      height: 16px;
      line-height: 14px;
      text-align: center;
      border: none;
      background: transparent;
      color: inherit;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      opacity: 0.6;
      flex-shrink: 0;
    }

    .tab-close:hover { background: rgba(255, 107, 122, 0.25); color: #fff; opacity: 1; }

    .tab-new {
      margin-top: 6px;
      width: 34px;
      height: 34px;
      border: none;
      background: transparent;
      color: var(--tab-text);
      font-size: 20px;
      border-radius: 8px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .tab-new:hover { background: var(--tab-active-bg); color: var(--tab-text-active); }

    /* 内容区由 WebContentsView 覆盖，这里只留空 */
    #content-placeholder {
      flex: 1;
      background: #0d0f1a;
    }

    body { display: flex; flex-direction: column; }

    /* 账号选择浮层 */
    #account-picker {
      position: fixed;
      top: 44px;
      left: 8px;
      width: 300px;
      max-height: 70vh;
      overflow-y: auto;
      background: #1c1f38;
      border: 1px solid rgba(139, 147, 255, 0.35);
      border-radius: 12px;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.55);
      z-index: 100;
      padding: 8px;
      display: none;
    }

    #account-picker.show { display: block; }

    .ap-group-title {
      font-size: 11px;
      color: #8a90b8;
      padding: 8px 10px 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .ap-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border-radius: 8px;
      color: #dde1ff;
      font-size: 13px;
      cursor: pointer;
    }

    .ap-item:hover { background: rgba(139, 147, 255, 0.15); }

    .ap-item .ap-last {
      font-size: 10px;
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.4);
      border-radius: 4px;
      padding: 0 4px;
      flex-shrink: 0;
    }

    .ap-item .ap-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .ap-sep { height: 1px; background: rgba(255, 255, 255, 0.08); margin: 6px 4px; }

    .ap-new {
      color: #8b93ff;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="tabbar">
    <button class="tab-new" id="btn-new" title="新建标签 (Ctrl+T)">+</button>
  </div>
  <div id="content-placeholder"></div>
  <div id="account-picker"></div>

  <script>
    const tabbar = document.getElementById('tabbar');
    const btnNew = document.getElementById('btn-new');

    let tabs = [];
    let activeTabId = null;
    let dragSrcId = null;

    function api() { return window.electronAPI; }

    function render() {
      // 保留 + 按钮，重建其余标签
      tabbar.querySelectorAll('.tab').forEach(el => el.remove());
      const frag = document.createDocumentFragment();
      for (const t of tabs) {
        const el = document.createElement('div');
        el.className = 'tab' + (t.tabId === activeTabId ? ' active' : '');
        el.dataset.tabId = t.tabId;
        el.draggable = true;

        const title = document.createElement('span');
        title.className = 'tab-title';
        title.textContent = t.name || t.title || '未命名';
        title.title = title.textContent;
        el.appendChild(title);

        const close = document.createElement('button');
        close.className = 'tab-close';
        close.textContent = '×';
        close.title = '关闭标签';
        close.addEventListener('click', (e) => {
          e.stopPropagation();
          api().tabsClose(t.tabId);
        });
        el.appendChild(close);

        el.addEventListener('click', () => api().tabsSwitch(t.tabId));

        // 拖拽排序
        el.addEventListener('dragstart', (e) => {
          dragSrcId = t.tabId;
          el.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });
        el.addEventListener('dragend', () => {
          el.classList.remove('dragging');
          tabbar.querySelectorAll('.tab').forEach(x => x.classList.remove('drag-over'));
        });
        el.addEventListener('dragover', (e) => {
          e.preventDefault();
          if (dragSrcId && dragSrcId !== t.tabId) el.classList.add('drag-over');
        });
        el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
        el.addEventListener('drop', (e) => {
          e.preventDefault();
          el.classList.remove('drag-over');
          if (!dragSrcId || dragSrcId === t.tabId) return;
          const ids = tabs.map(x => x.tabId);
          const from = ids.indexOf(dragSrcId);
          const to = ids.indexOf(t.tabId);
          if (from < 0 || to < 0) return;
          ids.splice(from, 1);
          ids.splice(to, 0, dragSrcId);
          api().tabsReorder(ids);
          dragSrcId = null;
        });

        frag.appendChild(el);
      }
      tabbar.insertBefore(frag, btnNew.nextSibling);
    }

    async function refresh() {
      const res = await api().tabsList();
      if (res && res.success) {
        tabs = res.tabs || [];
        activeTabId = res.activeTabId;
        render();
      }
    }

    btnNew.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleAccountPicker();
    });

    // 点击别处关闭浮层
    document.addEventListener('click', (e) => {
      const picker = document.getElementById('account-picker');
      if (!picker.classList.contains('show')) return;
      if (picker.contains(e.target) || e.target === btnNew) return;
      picker.classList.remove('show');
    });

    // 打开/关闭账号选择浮层
    async function toggleAccountPicker() {
      const picker = document.getElementById('account-picker');
      if (picker.classList.contains('show')) {
        picker.classList.remove('show');
        return;
      }
      await renderAccountPicker();
      picker.classList.add('show');
    }

    // 渲染账号选择浮层：按平台分组 + 每平台上次账号标记 + 新建账号
    async function renderAccountPicker() {
      const picker = document.getElementById('account-picker');
      picker.innerHTML = '<div class="ap-group-title">加载中...</div>';
      let data;
      try {
        data = await api().accountsList();
      } catch (err) {
        picker.innerHTML = '<div class="ap-group-title">加载失败</div>';
        return;
      }
      const groups = (data && data.groups) || [];
      const unknown = (data && data.unknown) || [];
      const hasAny = groups.length > 0 || unknown.length > 0;

      let html = '';
      for (const g of groups) {
        html += '<div class="ap-group-title">' + escapeHtml(g.providerName) + '</div>';
        for (const a of g.accounts) {
          const isLast = a.id === g.lastProfileId;
          html += '<div class="ap-item" data-profile-id="' + a.id + '">' +
            '<span class="ap-name">' + escapeHtml(a.name) + '</span>' +
            (isLast ? '<span class="ap-last">上次</span>' : '') +
          '</div>';
        }
      }
      if (unknown.length > 0) {
        html += '<div class="ap-group-title">未选平台</div>';
        for (const a of unknown) {
          html += '<div class="ap-item" data-profile-id="' + a.id + '">' +
            '<span class="ap-name">' + escapeHtml(a.name) + '</span>' +
          '</div>';
        }
      }
      if (!hasAny) {
        html += '<div class="ap-group-title">暂无账号</div>';
      }
      html += '<div class="ap-sep"></div>';
      html += '<div class="ap-item ap-new" id="ap-new-account">+ 新建账号</div>';
      picker.innerHTML = html;

      picker.querySelectorAll('.ap-item[data-profile-id]').forEach(el => {
        el.addEventListener('click', async () => {
          picker.classList.remove('show');
          await api().tabsCreate({ profileId: el.dataset.profileId });
        });
      });
      const newBtn = document.getElementById('ap-new-account');
      if (newBtn) {
        newBtn.addEventListener('click', async () => {
          picker.classList.remove('show');
          // 新建"未确定平台"账号，进去后选平台
          await api().tabsCreate({});
        });
      }
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    if (api() && api().onTabsUpdated) {
      api().onTabsUpdated((data) => {
        tabs = (data && data.tabs) || [];
        activeTabId = data && data.activeTabId;
        render();
      });
    }

    // 初始加载
    if (api() && api().tabsList) {
      refresh();
    } else {
      setTimeout(() => { if (api() && api().tabsList) refresh(); }, 500);
    }
  </script>
</body>
</html>
