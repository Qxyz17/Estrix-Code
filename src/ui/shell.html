<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estrix Code</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bar-bg: #14162a;
      --tab-bg: #1c1f38;
      --tab-active-bg: #262a4a;
      --tab-text: #a8add8;
      --tab-text-active: #e6e9ff;
      --border: rgba(255, 255, 255, 0.08);
      --primary: #8b93ff;
      --danger: #ff6b7a;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #0d0f1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      user-select: none;
    }

    /* 标签栏（高度与主进程 TAB_BAR_HEIGHT 保持一致） */
    #tabbar {
      height: 40px;
      background: var(--bar-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: stretch;
      padding: 0 6px;
      gap: 4px;
      overflow-x: auto;
      overflow-y: hidden;
    }

    #tabbar::-webkit-scrollbar { height: 0; }

    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 12px;
      margin-top: 6px;
      min-width: 120px;
      max-width: 220px;
      height: 34px;
      background: var(--tab-bg);
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      color: var(--tab-text);
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease, color 0.15s ease;
      position: relative;
    }

    .tab:hover { background: var(--tab-active-bg); color: var(--tab-text-active); }

    .tab.active {
      background: var(--tab-active-bg);
      color: var(--tab-text-active);
      border-color: rgba(139, 147, 255, 0.4);
    }

    .tab.dragging { opacity: 0.4; }
    .tab.drag-over { border-left: 2px solid var(--primary); }

    .tab-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tab-close {
      width: 16px;
      height: 16px;
      line-height: 14px;
      text-align: center;
      border: none;
      background: transparent;
      color: inherit;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      opacity: 0.6;
      flex-shrink: 0;
    }

    .tab-close:hover { background: rgba(255, 107, 122, 0.25); color: #fff; opacity: 1; }

    .tab-new {
      margin-top: 6px;
      width: 34px;
      height: 34px;
      border: none;
      background: transparent;
      color: var(--tab-text);
      font-size: 20px;
      border-radius: 8px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .tab-new:hover { background: var(--tab-active-bg); color: var(--tab-text-active); }

    /* 内容区由 WebContentsView 覆盖，这里只留空 */
    #content-placeholder {
      flex: 1;
      background: #0d0f1a;
    }

    body { display: flex; flex-direction: column; }
  </style>
</head>
<body>
  <div id="tabbar">
    <button class="tab-new" id="btn-new" title="新建标签 (Ctrl+T)">+</button>
  </div>
  <div id="content-placeholder"></div>

  <script>
    const tabbar = document.getElementById('tabbar');
    const btnNew = document.getElementById('btn-new');

    let tabs = [];
    let activeTabId = null;
    let dragSrcId = null;

    function api() { return window.electronAPI; }

    function render() {
      // 保留 + 按钮，重建其余标签
      tabbar.querySelectorAll('.tab').forEach(el => el.remove());
      const frag = document.createDocumentFragment();
      for (const t of tabs) {
        const el = document.createElement('div');
        el.className = 'tab' + (t.tabId === activeTabId ? ' active' : '');
        el.dataset.tabId = t.tabId;
        el.draggable = true;

        const title = document.createElement('span');
        title.className = 'tab-title';
        title.textContent = t.name || t.title || '未命名';
        title.title = title.textContent;
        el.appendChild(title);

        const close = document.createElement('button');
        close.className = 'tab-close';
        close.textContent = '×';
        close.title = '关闭标签';
        close.addEventListener('click', (e) => {
          e.stopPropagation();
          api().tabsClose(t.tabId);
        });
        el.appendChild(close);

        el.addEventListener('click', () => api().tabsSwitch(t.tabId));

        // 拖拽排序
        el.addEventListener('dragstart', (e) => {
          dragSrcId = t.tabId;
          el.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });
        el.addEventListener('dragend', () => {
          el.classList.remove('dragging');
          tabbar.querySelectorAll('.tab').forEach(x => x.classList.remove('drag-over'));
        });
        el.addEventListener('dragover', (e) => {
          e.preventDefault();
          if (dragSrcId && dragSrcId !== t.tabId) el.classList.add('drag-over');
        });
        el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
        el.addEventListener('drop', (e) => {
          e.preventDefault();
          el.classList.remove('drag-over');
          if (!dragSrcId || dragSrcId === t.tabId) return;
          const ids = tabs.map(x => x.tabId);
          const from = ids.indexOf(dragSrcId);
          const to = ids.indexOf(t.tabId);
          if (from < 0 || to < 0) return;
          ids.splice(from, 1);
          ids.splice(to, 0, dragSrcId);
          api().tabsReorder(ids);
          dragSrcId = null;
        });

        frag.appendChild(el);
      }
      tabbar.insertBefore(frag, btnNew.nextSibling);
    }

    async function refresh() {
      const res = await api().tabsList();
      if (res && res.success) {
        tabs = res.tabs || [];
        activeTabId = res.activeTabId;
        render();
      }
    }

    btnNew.addEventListener('click', (e) => {
      e.stopPropagation();
      // 用原生菜单弹出账号选择（浮层会被 40px 高的标签栏视图裁剪，改用原生菜单）
      api().tabsCreateMenu();
    });

    if (api() && api().onTabsUpdated) {
      api().onTabsUpdated((data) => {
        tabs = (data && data.tabs) || [];
        activeTabId = data && data.activeTabId;
        render();
      });
    }

    // 初始加载
    if (api() && api().tabsList) {
      refresh();
    } else {
      setTimeout(() => { if (api() && api().tabsList) refresh(); }, 500);
    }
  </script>
</body>
</html>
