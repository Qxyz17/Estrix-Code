<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estrix Code</title>
  <link rel="stylesheet" href="fonts.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* 深色（默认）—— 中性蓝灰，去 AI 紫 */
    :root {
      --bar-bg: #17181c;
      --bar-border: rgba(255, 255, 255, 0.07);
      --tab-bg: transparent;
      --tab-hover-bg: rgba(255, 255, 255, 0.05);
      --tab-active-bg: rgba(255, 255, 255, 0.09);
      --tab-text: #8b8f9a;
      --tab-text-active: #f0f1f4;
      --accent: #5eb0ef;
      --danger: #e5646e;
      --app-bg: #0f1013;
      --radius: 9px;
      --ease: cubic-bezier(0.32, 0.72, 0, 1);
    }

    /* 浅色：跟随系统 */
    @media (prefers-color-scheme: light) {
      :root {
        --bar-bg: #fbfbfc;
        --bar-border: rgba(0, 0, 0, 0.06);
        --tab-hover-bg: rgba(0, 0, 0, 0.04);
        --tab-active-bg: rgba(0, 0, 0, 0.07);
        --tab-text: #6b6f7a;
        --tab-text-active: #17181c;
        --accent: #2f7fd8;
        --danger: #d13d47;
        --app-bg: #ffffff;
      }
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--app-bg);
      font-family: 'HarmonyOS Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
      user-select: none;
    }

    /* 标签栏（高度与主进程 TAB_BAR_HEIGHT 保持一致） */
    #tabbar {
      height: 40px;
      background: var(--bar-bg);
      border-bottom: 1px solid var(--bar-border);
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 3px;
      overflow-x: auto;
      overflow-y: hidden;
    }

    #tabbar::-webkit-scrollbar { height: 0; }

    .tab {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 10px 0 12px;
      min-width: 100px;
      max-width: 200px;
      height: 28px;
      background: var(--tab-bg);
      border: none;
      border-radius: var(--radius);
      color: var(--tab-text);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.16s var(--ease), color 0.16s var(--ease);
      position: relative;
    }

    .tab:hover { background: var(--tab-hover-bg); color: var(--tab-text-active); }

    .tab.active {
      background: var(--tab-active-bg);
      color: var(--tab-text-active);
      font-weight: 560;
    }

    .tab.active::before {
      content: '';
      position: absolute;
      left: 4px; top: 7px; bottom: 7px;
      width: 2.5px;
      border-radius: 2px;
      background: var(--accent);
    }

    .tab.dragging { opacity: 0.4; }
    .tab.drag-over { box-shadow: -2px 0 0 0 var(--accent); }

    .tab-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tab-close {
      width: 17px;
      height: 17px;
      line-height: 15px;
      text-align: center;
      border: none;
      background: transparent;
      color: inherit;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
      opacity: 0;
      flex-shrink: 0;
      transition: opacity 0.14s var(--ease), background 0.14s var(--ease);
    }

    .tab:hover .tab-close { opacity: 0.55; }
    .tab-close:hover { background: rgba(229, 100, 110, 0.22); color: var(--danger); opacity: 1 !important; }

    .tab-new {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: var(--tab-text);
      font-size: 17px;
      border-radius: var(--radius);
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.16s var(--ease), color 0.16s var(--ease);
    }

    .tab-new:hover { background: var(--tab-hover-bg); color: var(--tab-text-active); }

    /* 内容区由 WebContentsView 覆盖，这里只留空 */
    #content-placeholder {
      flex: 1;
      background: var(--app-bg);
    }

    body { display: flex; flex-direction: column; }
  </style>
</head>
<body>
  <div id="tabbar">
    <button class="tab-new" id="btn-new" title="新建标签 (Ctrl+T)">+</button>
  </div>
  <div id="content-placeholder"></div>

  <script>
    const tabbar = document.getElementById('tabbar');
    const btnNew = document.getElementById('btn-new');

    let tabs = [];
    let activeTabId = null;
    let dragSrcId = null;

    function api() { return window.electronAPI; }

    function render() {
      // 保留 + 按钮，重建其余标签
      tabbar.querySelectorAll('.tab').forEach(el => el.remove());
      const frag = document.createDocumentFragment();
      for (const t of tabs) {
        const el = document.createElement('div');
        el.className = 'tab' + (t.tabId === activeTabId ? ' active' : '');
        el.dataset.tabId = t.tabId;
        el.draggable = true;

        const title = document.createElement('span');
        title.className = 'tab-title';
        const accountName = t.name || '未命名';
        // 从页面标题提取"对话名"：去掉平台后缀（如 " - DeepSeek"），过滤平台默认标题
        const rawTitle = (t.title || '').trim();
        const platformSuffixes = [' - DeepSeek', ' - ChatGPT', ' - Claude', ' - GLM', ' - Z.ai'];
        let convName = rawTitle;
        for (const suf of platformSuffixes) {
          if (convName.endsWith(suf)) { convName = convName.slice(0, -suf.length).trim(); break; }
        }
        const defaultTitles = ['DeepSeek', 'ChatGPT', 'Claude', 'GLM', 'Z.ai', 'Into the Unknown'];
        if (!convName || defaultTitles.includes(convName) || convName === accountName) convName = '';
        title.textContent = convName ? accountName + '-' + convName : accountName;
        title.title = title.textContent;
        el.appendChild(title);

        const close = document.createElement('button');
        close.className = 'tab-close';
        close.textContent = '×';
        close.title = '关闭标签';
        close.addEventListener('click', (e) => {
          e.stopPropagation();
          api().tabsClose(t.tabId);
        });
        el.appendChild(close);

        el.addEventListener('click', () => api().tabsSwitch(t.tabId));

        // 拖拽排序
        el.addEventListener('dragstart', (e) => {
          dragSrcId = t.tabId;
          el.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });
        el.addEventListener('dragend', () => {
          el.classList.remove('dragging');
          tabbar.querySelectorAll('.tab').forEach(x => x.classList.remove('drag-over'));
        });
        el.addEventListener('dragover', (e) => {
          e.preventDefault();
          if (dragSrcId && dragSrcId !== t.tabId) el.classList.add('drag-over');
        });
        el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
        el.addEventListener('drop', (e) => {
          e.preventDefault();
          el.classList.remove('drag-over');
          if (!dragSrcId || dragSrcId === t.tabId) return;
          const ids = tabs.map(x => x.tabId);
          const from = ids.indexOf(dragSrcId);
          const to = ids.indexOf(t.tabId);
          if (from < 0 || to < 0) return;
          ids.splice(from, 1);
          ids.splice(to, 0, dragSrcId);
          api().tabsReorder(ids);
          dragSrcId = null;
        });

        frag.appendChild(el);
      }
      tabbar.insertBefore(frag, btnNew.nextSibling);
    }

    async function refresh() {
      const res = await api().tabsList();
      if (res && res.success) {
        tabs = res.tabs || [];
        activeTabId = res.activeTabId;
        render();
      }
    }

    btnNew.addEventListener('click', (e) => {
      e.stopPropagation();
      // 用原生菜单弹出账号选择（浮层会被 40px 高的标签栏视图裁剪，改用原生菜单）
      api().tabsCreateMenu();
    });

    if (api() && api().onTabsUpdated) {
      api().onTabsUpdated((data) => {
        tabs = (data && data.tabs) || [];
        activeTabId = data && data.activeTabId;
        render();
      });
    }

    // 初始加载
    if (api() && api().tabsList) {
      refresh();
    } else {
      setTimeout(() => { if (api() && api().tabsList) refresh(); }, 500);
    }
  </script>
</body>
</html>
