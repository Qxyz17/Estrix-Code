<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置 - Estrix Code</title>
  <link rel="stylesheet" href="fonts.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0f1013;
      --surface: rgba(255,255,255,0.045);
      --surface-hover: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.08);
      --accent: #5eb0ef;
      --text: #e8eaee;
      --text-dim: #8b8f9a;
      --radius: 12px;
      --ease: cubic-bezier(0.32, 0.72, 0, 1);
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #fbfbfc; --surface: rgba(0,0,0,0.03); --surface-hover: rgba(0,0,0,0.06); --border: rgba(0,0,0,0.08); --accent: #2f7fd8; --text: #17181c; --text-dim: #6b6f7a; }
    }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'HarmonyOS Sans SC', -apple-system, 'Segoe UI', sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }
    body { display: flex; flex-direction: column; }
    header {
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      font-size: 18px;
      font-weight: 500;
    }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px;
      max-width: 760px;
    }
    .section {
      margin-bottom: 28px;
    }
    .section-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 12px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      margin-bottom: 8px;
    }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .row-label { font-weight: 500; }
    .row-desc { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; }
    select, input[type="text"], input[type="number"] {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition: border-color 0.16s var(--ease);
    }
    select:focus, input:focus { border-color: var(--accent); }
    .empty { color: var(--text-dim); text-align: center; padding: 60px 0; }
  </style>
</head>
<body>
  <header>设置</header>
  <main id="content">
    <div class="empty">设置页加载中…</div>
  </main>
  <script src="settings.js"></script>
</body>
</html>
