<div id="estrix-first-time-dialog" class="estrix-first-time-dialog estrix-hidden">
  <div class="estrix-first-time-box">
    <button id="estrix-btn-first-close" class="estrix-btn-icon estrix-first-time-close" title="关闭">×</button>
    <div class="estrix-first-time-text">首次创建对话时，需要初始化项目，并选择一个项目目录，不然无法使用</div>
    <div class="estrix-actions">
      <button id="estrix-btn-first-init" class="estrix-btn estrix-btn-primary">初始化项目</button>
    </div>
  </div>
</div>
<div id="estrix-tool-mask" class="estrix-tool-mask estrix-hidden">
  <div class="estrix-tool-mask-box">
    <span class="estrix-tool-mask-spinner"></span>
    <div class="estrix-tool-mask-text">工具调用执行中，请不要有额外操作</div>
    <button id="estrix-tool-mask-cancel" class="estrix-tool-mask-cancel estrix-hidden">停止</button>
  </div>
</div>
